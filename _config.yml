# Site settings
title: Ricardo's Notes
description: 'Articles about Java, JVM tooling, AI harnesses, add-ons, and side projects.'
url: 'https://ssricardo.github.io'
baseurl: ''
favicon: '/images/favicons/favicon.ico'
theme: 'jekyll-theme-yat'
# google_analytics: 'UA-XXXXXX-X'
# disqus_shortname: 'your-disqus-name'

author: Ricardo

lang: en
translate_langs: []
night_mode: 'on'

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
  -
    scope:
      path: ''
      type: 'pages'
    values:
      layout: 'page'
  -
    scope:
      path: ''
    values:
      image: '/images/cover.jpg'
      banner:
        height: '350px'
        min_height: '240px'
  -
    scope:
      path: ''
      type: 'posts'
    values:
      sidebar:
        - article-menu
# Build settings
destination: _site
paginate: 10
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge
header_pages:
  - index.html
  - categories.md
  - about.md

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png', 'tmp-new-articles']

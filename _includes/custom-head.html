<script>
  (function() {
    var theme = 'dark';
    try {
      var saved = sessionStorage.getItem('theme') || localStorage.getItem('theme');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed.nightShift === 'boolean') {
          theme = parsed.nightShift ? 'dark' : 'light';
        }
      }
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
